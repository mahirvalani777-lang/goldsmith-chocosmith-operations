</style></head><body><div id="app"></div><div id="modal-root"></div><div id="toast" role="status" aria-live="polite"></div><script>// Production requisitions and numbered goods issues. All operations are browser-local demo transactions.
const qty=v=>Math.round(Number(v)*1000)/1000;
const must=(yes,msg)=>{if(!yes)throw new Error(msg)};
const now=()=>new Date().toISOString();
function initialiseIssues(s){
  if(!Array.isArray(s.requisitions))s.requisitions=[{id:'MRS-DEMO-001',job:'JC-G-1024-003',entity:'Goldsmith',stage:'Mixing',purpose:'Planned production',reason:'Example initial sugar requirement for the linked job',needed:'2026-10-26',requestedBy:'Production operator',status:'Pending approval',created:'2026-10-26T08:00:00.000Z',lines:[{id:'M1',item:'RM-SUG-01',name:'Sugar M-30',unit:'kg',requested:25,approved:0,issued:0}]}];
  s.gins??=[];s.productionCustody??=[];s.issueLedger??=[];s.issueTokens??=[];s.issueSchema=1;return s;
}
function positive(v){const n=Number(v);must(Number.isFinite(n)&&n>0,'Enter a positive material quantity.');must(Math.abs(n-qty(n))<1e-8,'Use no more than three decimals for this kg demonstration.');return qty(n);}
function actor(s,allowed){must(allowed.includes(s.role),'Switch to '+allowed.join(' or ')+' to perform this action.');}
function eligible(l,date,entity,location,item){return l.entity===entity&&l.location===location&&l.item===item&&l.stage==='Raw material'&&l.qty>0&&!l.hold&&!l.countHold&&!l.recall&&!l.discrepancyHold&&!l.countPaused&&l.quality==='Released'&&(l.expiry?l.expiry>date:l.expiryRequired===false);}
function allocate(s,rows,entity,location,date){
  const used=new Map(),allocations=[];
  for(const row of rows){let remaining=row.quantity;const lots=s.lots.filter(l=>eligible(l,date,entity,location,row.item)).sort((a,b)=>{if(a.expiry&&b.expiry)return a.expiry.localeCompare(b.expiry)||String(a.receivedAt||a.id).localeCompare(String(b.receivedAt||b.id));if(a.expiry)return -1;if(b.expiry)return 1;return String(a.receivedAt||a.id).localeCompare(String(b.receivedAt||b.id));});
    for(const lot of lots){const available=qty(lot.qty-(used.get(lot.id)||0));if(available<=0)continue;const take=qty(Math.min(remaining,available));allocations.push({line:row.line,item:row.item,name:row.name,unit:row.unit,lot:lot.id,expiry:lot.expiry||'',from:location,quantity:take});used.set(lot.id,qty((used.get(lot.id)||0)+take));remaining=qty(remaining-take);if(!remaining)break;}
    must(remaining===0,'Insufficient eligible stock for '+row.item+' at '+location+'. Held, expired or other-entity stock cannot be issued.');
  }return allocations;
}
function nextNumber(s,prefix){let i=s.seq+1;while(s.gins.some(g=>g.id===prefix+i)||s.requisitions.some(r=>r.id===prefix+i))i++;return prefix+i;}
function docStatus(r){return r.lines.every(l=>l.issued===l.approved)?'Fulfilled':r.lines.some(l=>l.issued>0)?'Part issued':'Approved';}
function postGin(s,p,tools){
  actor(s,['Stores operator']);must(p.token&&typeof p.token==='string','A unique posting reference is required.');must(!s.issueTokens.includes(p.token),'This posting reference was already used. No duplicate GIN was posted.');
  const mrs=p.mrs?s.requisitions.find(r=>r.id===p.mrs):null;
  const extra=p.extra?s.requests.find(r=>r.id===p.extra):null;
  must(Boolean(mrs)!==Boolean(extra),'Select one approved MRS or extra-material request.');
  const request=mrs||extra;const job=s.jobs.find(j=>j.id===request.job);must(job&&!job.closed,'Cannot issue against a closed or missing job card.');
  must(mrs?['Approved','Part issued'].includes(mrs.status):['Approved','Part issued'].includes(extra.status),'The material request must be approved and outstanding before GIN posting.');
  const entity=job.entity;const floors={Goldsmith:'G-PROD',Chocosmith:'C-PROD'};must(p.destination===floors[entity],'Choose the production floor belonging to the job entity.');
  const locations=p.locations||[{Location_ID:'G-DRM',Branch_Entity:'Goldsmith Food Products',Store_Type:'Raw Material'},{Location_ID:'G-LRM',Branch_Entity:'Goldsmith Food Products',Store_Type:'Raw Material'},{Location_ID:'C-DRM',Branch_Entity:'Chocosmith Food Products',Store_Type:'Raw Material'},{Location_ID:'C-LRM',Branch_Entity:'Chocosmith Food Products',Store_Type:'Raw Material'}];
  must(locations.some(l=>l.Location_ID===p.location&&l.Branch_Entity===entity+' Food Products'&&l.Store_Type==='Raw Material'),'Source store must be a raw-material store of the job entity.');
  must(p.handedTo?.trim(),'Record the production person receiving the material.');must(p.date&&/^\d{4}-\d{2}-\d{2}$/.test(p.date),'Enter a valid issue date.');
  const today=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'});must(p.date<=today,'A posted issue cannot be future dated.');
  const availableLines=mrs?mrs.lines:[{id:extra.id,item:extra.item,name:extra.item,unit:'kg',approved:extra.qty,issued:extra.issued}];
  must(Array.isArray(p.lines)&&p.lines.length,'Enter at least one issue quantity.');const seen=new Set(),rows=[];
  for(const row of p.lines){must(!seen.has(row.line),'Duplicate request line in the GIN.');seen.add(row.line);const l=availableLines.find(x=>x.id===row.line);must(l,'Issue line does not belong to the request.');const q=positive(row.quantity);must(q<=qty(l.approved-l.issued),'Issue quantity exceeds the remaining approved quantity for '+l.item+'.');rows.push({line:l.id,item:l.item,name:l.name,unit:l.unit,quantity:q});}
  // All lines and all stock are checked before any mutation. The caller commits a cloned state.
  const allocations=allocate(s,rows,entity,p.location,today>p.date?today:p.date);
  const id=nextNumber(s,'GIN-'+p.date.replaceAll('-','')+'-');const ref=mrs?mrs.id:extra.id;
  const gin={id,job:job.id,entity,mrs:mrs?.id||'',extra:extra?.id||'',request:ref,stage:mrs?.stage||job.stage,from:p.location,to:p.destination,date:p.date,handedTo:p.handedTo.trim(),issuedBy:s.role,approvedBy:request.approvedBy||request.approver||'Production manager',status:'Posted',reason:p.remarks?.trim()||'',lines:allocations,created:now(),token:p.token,total:qty(rows.reduce((a,r)=>a+r.quantity,0))};
  for(const a of allocations){const l=s.lots.find(x=>x.id===a.lot);l.qty=qty(l.qty-a.quantity);const c=s.productionCustody.find(c=>c.job===job.id&&c.item===a.item&&c.lot===a.lot&&c.location===p.destination);if(c)c.qty=qty(c.qty+a.quantity);else s.productionCustody.push({job:job.id,item:a.item,name:a.name,lot:a.lot,location:p.destination,entity,qty:a.quantity,unit:a.unit});
    const eventBase={gin:id,request:ref,job:job.id,entity,item:a.item,lot:a.lot,unit:a.unit,date:p.date,actor:s.role};const eventId='IE-'+id+'-'+(s.issueLedger.length+1);s.issueLedger.push({...eventBase,id:eventId+'-OUT',location:p.location,quantity:-a.quantity,kind:'GIN_STORE_OUT'},{...eventBase,id:eventId+'-IN',location:p.destination,quantity:a.quantity,kind:'GIN_PRODUCTION_IN'});}
  for(const row of rows){if(mrs){const l=mrs.lines.find(l=>l.id===row.line);l.issued=qty(l.issued+row.quantity);}else extra.issued=qty(extra.issued+row.quantity);}
  request.status=mrs?docStatus(mrs):extra.issued===extra.qty?'Issued':'Part issued';job.issued=qty(job.issued+gin.total);s.gins.unshift(gin);s.issueTokens.push(p.token);tools.log(s,'GIN posted: stores to production',id,gin.total+' kg · '+job.id+' · '+ref+' · '+p.location+' → '+p.destination);return id;
}
function issueAction(s,action,p,tools){
  initialiseIssues(s);
  if(action==='initialiseIssues')return;
  if(action==='createMrs'){
    actor(s,['Production operator']);const j=s.jobs.find(j=>j.id===p.job);must(j&&!j.closed,'Select an open job card.');must(p.reason?.trim(),'Record why the materials are required.');must(p.stage?.trim(),'Enter the job stage.');must(['Planned production','Additional material'].includes(p.purpose),'Choose a request purpose.');must(Array.isArray(p.lines)&&p.lines.length&&p.lines.length<=20,'Enter between 1 and 20 material lines.');const seen=new Set();
    const lines=p.lines.map((l,i)=>{const m=p.materials?.find(m=>m.Material_ID===l.item);must(m&&m.Category==='Raw Material'&&m.Status==='Active','Select an active raw material from the master.');must(m.Base_Unit==='KG','This prototype issues kg materials only.');must(!seen.has(l.item),'Use one request line per material.');seen.add(l.item);return{id:'L'+(i+1),item:m.Material_ID,name:m.Material_Name,unit:'kg',requested:positive(l.quantity),approved:0,issued:0};});
    const id=nextNumber(s,'MRS-');s.requisitions.unshift({id,job:j.id,entity:j.entity,stage:p.stage.trim(),purpose:p.purpose,reason:p.reason.trim(),needed:p.needed||'',requestedBy:s.role,created:now(),status:'Pending approval',lines});tools.log(s,'MRS submitted for job',id,j.id+' · '+lines.length+' materials · no stock movement');return id;
  }
  if(action==='reviewMrs'){

function navigate(p,id=''){page=p;jobId=id;query='';filter='All';menu=false;render();window.scrollTo(0,0);}

function shell(body){const items=[['overview','Overview'],['jobs','Job cards'],['issues','MRS & GIN'],['stock','Inventory'],['receiving','Receipts & transfers'],['waste','Waste bank'],['quality','Quality & holds'],['finance','Supplier accounts'],['trace','Dispatch & traceability'],['approvals','Approval desk'],['audit','Activity & notifications'],['blueprint','Blueprint & demo guide']];return `<div class="shell"><div class="mobile-backdrop ${menu?'show':''}" data-action="menu"></div><aside class="sidebar ${menu?'open':''}"><div class="brand"><div class="brandmark">g</div><div><strong>Goldsmith<br>& Chocosmith</strong><small>OPERATIONS</small></div></div><div class="nav-label">WORKSPACE</div>${items.slice(0,9).map(([p,t])=>`<button class="nav ${page===p?'active':''}" data-page="${p}">${icon(p)}${t}</button>`).join('')}<div class="nav-label">CONTROL CENTRE</div>${items.slice(9).map(([p,t])=>`<button class="nav ${page===p?'active':''}" data-page="${p}">${icon(p)}${t}</button>`).join('')}<div class="sidebar-foot"><b>Two businesses. One clear view.</b>Prototype workspace<br><span class="inline-note" style="color:#a8bba8">Browser-local demonstration</span></div></aside><main class="main"><header class="topbar"><button class="menu-toggle" data-action="menu" aria-label="Toggle navigation">☰</button><div class="crumb">Workspace <span style="padding:0 8px">/</span> ${items.find(x=>x[0]===page)?.[1]||'Overview'}</div><div class="top-tools"><select id="branch" class="branch" aria-label="Entity filter">${['All entities','Goldsmith','Chocosmith'].map(r=>`<option ${state.branch===r?'selected':''}>${r}</option>`).join('')}</select><button class="toolbar-icon" data-page="audit" aria-label="Open notifications">${icon('bell')}<span class="count">${state.notifications.length}</span></button><select id="role" aria-label="Demonstration role">${ROLES.map(r=>`<option ${state.role===r?'selected':''}>${r}</option>`).join('')}</select><div class="avatar">${state.role.split(' ').map(x=>x[0]).join('')}</div></div></header><div class="notice"><span>DEMONSTRATION · Example operating data · No live bank payments or emails</span><span>Workbook catalogue + illustrative workflows</span></div><div class="content">${body}<div class="footer-note"><span>Goldsmith & Chocosmith · Operations prototype 1.1</span><span>Scenario date: 24 October 2026 · Saved on this browser</span></div></div></main></div>`;}
function overview(){const jobs=byEntity(state.jobs),lots=byEntity(state.lots),open=jobs.filter(x=>!x.closed);const out=jobs.reduce((a,j)=>a+j.output,0),plan=jobs.reduce((a,j)=>a+j.planned,0);return heading('OPERATIONS / 24 OCTOBER 2026','A clear view of the floor.','Production, stock and exceptions. Together in one place.',`<button class="btn secondary" data-action="walkthrough">Start walkthrough ↗</button><button class="btn" data-page="jobs">View job cards →</button>`)+`<div class="kpis">${kpi('Active job cards',open.length,'Across the selected entities')}${kpi('Finished output recorded',n(out)+' <span style="font-size:15px">kg</span>',n(plan)+' kg planned across these example JCs')}${kpi('Lots requiring attention',lots.filter(l=>stockStatus(l)!=='Released').length,'Inspection, expiry or exception holds')}${kpi('Requests awaiting approval',state.requests.filter(r=>r.status==='Pending').length+state.payments.filter(p=>p.status==='Pending approval').length,'Across both entities')}</div><div class="grid-two"><div>${card('Production in progress',table(['Job card / product','Stage','Completion','Status'],open.map(j=>`<tr><td><button class="link" data-job="${j.id}">${j.id}</button><br><span class="subtle">${j.product} · ${j.entity}</span></td><td>${j.stage}</td><td>${n(j.output)} / ${n(j.planned)} kg<div class="progress"><i style="width:${Math.min(100,j.output/j.planned*100)}%"></i></div></td><td>${pill(j.status)}</td></tr>`)),`<button class="link" data-page="jobs">All job cards ↗</button>`)}${card('Output by job card',`<div class="card-body"><div class="subtle">Actual finished output against planned quantity · kg</div><div class="chart">${jobs.map(j=>`<div class="bar-group" title="${j.id}: ${j.output} of ${j.planned} kg"><div class="bar pale" style="height:${Math.max(4,j.planned/1200*120)}px"></div><div class="bar" style="height:${Math.max(3,j.output/1200*120)}px"></div><span>${j.id.slice(-3)}</span></div>`).join('')}</div><div class="legend"><span><i class="dot pale"></i>Planned</span><span><i class="dot"></i>Finished output</span></div></div>`)}</div><div>${card('Needs your attention',`<div class="card-body"><div class="alert-row"><div class="alert-icon">!</div><div><div class="alert-title">Quality release pending</div><p class="alert-desc">${lots.filter(l=>l.quality==='Awaiting inspection').length} lots remain unavailable until inspection.</p><button class="link" data-page="quality">Review inspection queue →</button></div></div><div class="alert-row"><div class="alert-icon">↔</div><div><div class="alert-title">Waste receipt difference</div><p class="alert-desc">WB-002: 8 kg sent, 7.5 kg received. Store manager investigation.</p><button class="link" data-page="waste">Open waste bank →</button></div></div><div class="alert-row"><div class="alert-icon">◷</div><div><div class="alert-title">Source transfers need reconciliation</div><p class="alert-desc">2 workbook transfers have no matching transfer entries in the supplied ledger.</p><button class="link" data-action="sourceTransfers">Inspect source records →</button></div></div></div>`)}${card('Recent activity',`<div class="card-body">${state.audit.slice(0,4).map(a=>`<div class="activity"><div class="activity-dot"></div><div><p>${esc(a.action)}</p><small>${esc(a.ref)} · ${esc(a.role)}</small></div></div>`).join('')}</div>`)}<div class="info">The 36 material records and six original locations come from your workbook. Operating lots, users, recipes and transactions shown here are hypothetical examples.</div></div></div>`;}
function jobsPage(){if(jobId)return jobDetail(state.jobs.find(j=>j.id===jobId));const jobs=byEntity(state.jobs).filter(j=>(filter==='All'||j.status===filter)&&(!query||(j.id+' '+j.product).toLowerCase().includes(query.toLowerCase())));return heading('PRODUCTION','Every job. Every stage.','Partial output, material movement and exceptions stay with the respective job card.',`<button class="btn" data-action="output">+ Record output</button>`)+`<div class="filters"><input class="search" id="query" placeholder="Search job card or product" value="${esc(query)}" aria-label="Search job cards"><select id="filter" aria-label="Filter job status">${['All','In progress','Released','Closed'].map(x=>`<option ${x===filter?'selected':''}>${x}</option>`).join('')}</select></div>`+card('Job card register',table(['Job card','Product / entity','Planned','Actual finished','Remaining','Stage','Status'],jobs.map(j=>`<tr><td><button class="link" data-job="${j.id}">${j.id}</button><div class="inline-note">Due ${j.due}</div></td><td>${j.product}<div class="subtle">${j.entity}</div></td><td>${n(j.planned)} kg</td><td>${n(j.output)} kg</td><td>${n(Math.max(0,j.planned-j.output))} kg${j.output>j.planned?'<div class="pill amber">Overproduction</div>':''}</td><td>${j.stage}</td><td>${pill(j.status)}</td></tr>`)));}
function jobDetail(j){if(!j)return '<p>Job card not found.</p>';const extra=state.requests.filter(r=>r.job===j.id);const accounted=j.consumed+j.returned+j.waste+j.loss;return `<button class="link back" data-page="jobs">← All job cards</button>`+heading('JOB CARD / '+j.entity.toUpperCase(),j.id,j.product+' · '+j.recipe,`${pill(j.status)}<button class="btn secondary" data-action="mrsCreate" data-id="${j.id}">Create MRS</button><button class="btn secondary" data-action="extra" data-id="${j.id}">Request extra material</button><button class="btn" data-action="output" data-id="${j.id}">+ Record output</button>`)+`<div class="kpis">${kpi('Planned finished output',n(j.planned)+' kg','Original approved target')}${kpi('Actual finished output',n(j.output)+' kg',n(Math.max(0,j.planned-j.output))+' kg remaining')}${kpi('Total material issued',n(j.issued)+' kg','Issues are not the same as consumption')}${kpi('Input quantity explained',n(accounted)+' kg',n(round(j.issued-accounted))+' kg still in production / unresolved')}</div><div class="grid-two"><div>${jobIssuesSection(j)}${card('Stage-wise production',`<div class="card-body">${['Weighing & issue','Mixing / processing','Moulding','Packing','Quality release'].map((s,i)=>`<div class="stage"><div class="stage-num">${i+1}</div><div class="stage-main"><b>${s}</b><div class="subtle">${i===0?n(j.issued)+' kg issued':i===3?n(j.output)+' kg finished output recorded':i===4?'Quality decision remains separate from JC closure':'Actual stage transactions retained on this JC'}</div></div>${pill(i<2&&j.output?'Recorded':i===3&&j.output?'Partial':'Stage review',i<2&&j.output?'green':'')}</div>`).join('')}</div>`)}${card('Output entries',table(['Reference','Stage / batch','Quantity','Stock state'],j.entries.map(e=>{const l=state.lots.find(x=>x.id===e.lot);return `<tr><td>${e.id}<div class="inline-note">${e.time}</div></td><td>${e.stage}<br><span class="code">${e.lot}</span></td><td>${n(e.qty)} kg</td><td>${l?pill(stockStatus(l)):pill('Historical')}</td></tr>`})),`<button class="link" data-page="quality">Quality queue ↗</button>`)}${card('Additional material requests',table(['Request / material','Requested','Issued','Status','Action'],extra.map(r=>`<tr><td>${r.id}<div class="inline-note">${r.item}</div></td><td>${n(r.qty)} kg</td><td>${n(r.issued)} kg</td><td>${pill(r.status)}</td><td>${['Approved','Part issued'].includes(r.status)?btn('Issue','issueExtra',r.id):r.status==='Pending'?'<span class="subtle">Production manager approval</span>':'—'}</td></tr>`)))}</div><div>${card('Material accountability',`<div class="card-body">${[['Actual consumption',j.consumed],['Unused returns',j.returned],['Collected waste',j.waste],['Unrecoverable loss',j.loss],['Still in production / unresolved',round(j.issued-accounted)]].map(([l,v])=>`<div class="stage"><div class="stage-main">${l}</div><b>${n(v)} kg</b></div>`).join('')}<div class="info">Physical input accounting is separate from finished output. Do not add consumed material to output as another stock balance.</div></div>`)}${card('Recipe & version',`<div class="card-body"><b>${esc(j.recipe)}</b><p class="subtle" style="margin-top:8px">Illustrative production specification. Not an approved manufacturing recipe.</p><button class="link" data-action="recipe" data-id="${j.id}">View example recipe →</button></div>`)}${card('Closure checklist',`<div class="card-body"><p class="subtle">Production manager reviews output, consumption, returns, waste and authorised exceptions. Quantity completion alone cannot close a JC.</p><div class="info warning">Closure and reopening are specified in the blueprint; this prototype focuses on partial outputs and approvals.</div></div>`)}</div></div>`;}
function stockPage(){const tabs=`<div class="tabs">${[['stock','Demo stock & lots'],['catalogue','Workbook material master'],['counts','Blind count demonstration']].map(([id,t])=>`<button class="tab ${inventoryTab===id?'active':''}" data-tab="${id}">${t}</button>`).join('')}</div>`;let body='';if(inventoryTab==='catalogue'){const mats=source.Material_Master.filter(m=>(m.Material_ID+' '+m.Material_Name).toLowerCase().includes(query.toLowerCase()));body=`<div class="filters"><input id="query" class="search" aria-label="Search materials" placeholder="Search code or material" value="${esc(query)}"><span class="pill source">Workbook source · ${mats.length} records</span></div>`+card('Material master',table(['Material / code','Category','Stock unit','Pack','Cost / kg','Reorder level'],mats.map(m=>`<tr><td>${esc(m.Material_Name)}<div class="code">${m.Material_ID}</div></td><td>${m.Category}</td><td>${m.Base_Unit}</td><td>${m.Pack_Type} · ${n(m.Pack_Size_KG)} kg</td><td>${money(m.Unit_Cost_INR)}</td><td>${n(m.Reorder_Level_KG)} kg</td></tr>`)))+`<div class="info">Source master values are retained for review. Prices, reorder levels and pack conversions are not certified live settings.</div>`;}else if(inventoryTab==='counts'){body=`<div class="info">Switch to Stores operator to submit a blind count. The expected balance is hidden in the count form and revealed after submission. Recount and adjustment controls are described in the blueprint.</div>`+card('Submitted counts',table(['Reference','Batch','Physical count','System at count','Variance','Status'],state.counts.map(c=>`<tr><td>${c.id}</td><td>${c.lot}</td><td>${n(c.actual)} kg</td><td>${n(c.expected)} kg</td><td>${n(c.variance)} kg</td><td>${pill(c.status)}</td></tr>`)),`<button class="btn small" data-action="count">+ Blind count</button>`);}else{const lots=byEntity(state.lots).filter(l=>(l.id+' '+l.name).toLowerCase().includes(query.toLowerCase()));body=`<div class="filters"><input id="query" class="search" aria-label="Search stock" placeholder="Search batch or material" value="${esc(query)}"><span class="subtle">Demonstration quantities · not reconciled opening stock</span></div>`+card('Stock by batch and location',table(['Material / batch','Entity / location','Physical qty','Expiry','Status'],lots.map(l=>`<tr><td>${esc(l.name)}<div class="code">${l.id}</div></td><td>${l.entity}<div class="inline-note">${l.location}</div></td><td>${n(l.qty)} kg</td><td>${l.expiry||'Missing'}</td><td>${pill(stockStatus(l))}</td></tr>`)));}return heading('INVENTORY','Stock with a clear identity.','Material codes, lot custody and restrictions remain visible.')+tabs+body;}
function receivingPage(){return heading('INBOUND','Receive what actually arrived.','Capture custody separately from acceptance, over-delivery and release.',`<button class="btn" data-action="receipt">+ Create GRN</button>`)+card('Example supplier receipts',table(['GRN / PO','Supplier / material','Ordered','Received','Excess','Status'],state.receipts.map(r=>`<tr><td>${r.id}<div class="code">${r.po}</div></td><td>${esc(r.supplier)}<div class="subtle">${esc(r.material)}</div></td><td>${n(r.ordered)} kg</td><td>${n(r.received)} kg</td><td>${n(r.excess)} kg</td><td>${pill(r.status)}</td></tr>`)))+card('Original locations',table(['Code','Entity','Store','Storage condition'],source.Location_Master.map(l=>`<tr><td class="code">${l.Location_ID}</td><td>${l.Branch_Entity}</td><td>${l.Store_Name}</td><td>${l.State_Type}</td></tr>`)),pill('Workbook source','source'))+card('Original internal transfers',table(['Transfer','Material','Route','Quantity','Source status'],source.Internal_Transfers.map(t=>`<tr><td>${t.Transfer_ID}</td><td>${t.Material_Name}</td><td>${t.From_Location} → ${t.To_Location}</td><td>${n(t.Quantity_KG)} kg</td><td>${pill('Unreconciled','amber')}<div class="inline-note">Workbook says ${t.Status}</div></td></tr>`)))+`<div class="info warning">The supplied ledger has no transfer events matching these records. The prototype preserves this gap; it does not invent balancing postings.</div>`;}
function wastePage(){const w=state.waste;return heading('WASTE BANK','Collect. Weigh. Account for it.','Operators handle routine receipts. Managers investigate exceptions.',`<button class="btn" data-action="waste">+ Declare collected waste</button>`)+`<div class="kpis">${kpi('Collected waste on hand',n(w.reduce((a,x)=>a+x.remaining,0))+' kg','Physically received, held for assessment')}${kpi('Awaiting stores receipt',w.filter(x=>x.received===null).length,'Declared waste is not yet bank stock')}${kpi('Receipt differences',w.filter(x=>x.state==='Receipt discrepancy').length,'Store manager investigation')}${kpi('Route capabilities','4','Rework · recycle sale · return · disposal')}</div>`+card('Waste bank register',table(['Receipt / JC','Material / reason','Declared','Received','On hand','State','Action'],w.map(x=>`<tr><td>${x.id}<div class="code">${x.job}</div></td><td>${esc(x.material)}<div class="subtle">${esc(x.reason)}</div></td><td>${n(x.declared)} kg</td><td>${x.received===null?'Pending':n(x.received)+' kg'}</td><td>${n(x.remaining)} kg</td><td>${pill(x.state)}</td><td>${x.received===null?btn('Weigh & receive','receiveWaste',x.id):btn('Route provisions','routes',x.id,true)}</td></tr>`)))+card('Routes stay controlled',`<div class="card-body"><div class="flow">${[['Rework / reuse','Suitability + linked rework JC'],['Recycler sale','Approved buyer + actual dispatch'],['Supplier return','Agreement + dispatch reference'],['Disposal','Evidence + accounts verification']].map(([a,b])=>`<div class="flow-node"><b>${a}</b><small>${b}</small><p style="margin:10px 0 0">${pill('Eligibility not configured','amber')}</p></div>`).join('')}</div><p class="subtle">All four routes are included in the blueprint. None grants permission to reuse or dispose of a material. Unrecoverable spillage is a loss record, not fictitious waste stock.</p></div>`);}
function qualityPage(){const lots=byEntity(state.lots).filter(l=>l.qty>0);return heading('QUALITY','Release is a quality decision.','Inspection, expiry and incident holds stay separate from production progress.')+card('Inspection & hold register',table(['Batch / material','Quantity','Current status','Origin','Action'],lots.map(l=>`<tr><td><span class="code">${l.id}</span><br>${esc(l.name)}</td><td>${n(l.qty)} kg</td><td>${pill(stockStatus(l))}${l.productionVerified===false?'<div class="inline-note">Production verification pending</div>':''}</td><td>${l.job||'Supplier receipt / opening example'}</td><td><div class="actions">${l.productionVerified===false?btn('Verify output','verifyOutput',l.id):''}${!l.recall?btn('Inspect','quality',l.id,true):btn('Incident details','incidentInfo',l.id,true)}${!l.recall&&l.quality==='Released'?btn('Place hold','hold',l.id,true):''}</div></td></tr>`)))+`<div class="info">Only the Quality role can release or reject output. A missing or expired date blocks release. Incident holds cannot be cleared through the normal inspection form.</div>`;}
function financePage(){return heading('SUPPLIER ACCOUNTS','From invoice to confirmed payment.','Illustrative invoices and suppliers · Actual workbook costs stay in the material master.')+`<div class="kpis">${kpi('Example invoices',state.payments.length,'One consolidated invoice view each')}${kpi('Pending approval',state.payments.filter(p=>p.status==='Pending approval').length,'Independent manager / Director review')}${kpi('Confirmed payments',money(state.payments.filter(p=>p.status==='Completed').reduce((a,p)=>a+p.amount,0)),'Only after proof verification')}${kpi('Manager approval limit','₹50 lakh','Per transaction; Director above limit')}</div>`+card('Supplier payment register',table(['Payment / invoice','Supplier','Request amount','Approval route','Status','Next action'],state.payments.map(p=>`<tr><td><button class="link" data-action="invoice" data-id="${p.id}">${p.id}</button><div class="code">${p.invoice}</div></td><td>${esc(p.supplier)}<div class="inline-note">${p.bank}</div></td><td>${money(p.amount)}</td><td>${p.amount>LIMIT?'Director':'Accounts manager'}</td><td>${pill(p.status)}</td><td>${p.status==='Pending approval'?btn('Review approval','paymentApprove',p.id):p.status==='Approved'?btn('Submit to bank','paymentExecute',p.id):p.status==='Submitted to bank'?btn('Record proof','paymentProof',p.id):p.status==='Proof awaiting verification'?btn('Verify & complete','paymentVerify',p.id):pill('Bank confirmed','green')}</td></tr>`)))+`<div class="grid-equal">${card('Advance & invoice reconciliation',`<div class="card-body"><h3>DEMO-INV-101</h3><div class="metric-grid"><div><small>Invoice total</small><b>₹1,00,000</b></div><div><small>Verified advance</small><b>₹20,000</b></div><div><small>Remaining payable</small><b>${money(state.payments[0].status==='Completed'?0:80000)}</b></div></div><p class="subtle" style="margin-top:14px">Pending payment: ${money(state.payments[0].status==='Completed'?0:80000)}. Pending amounts are shown separately, not treated as confirmed payments.</p>${btn('View invoice history','invoice','PAY-001',true)}</div>`)}${card('Payment controls',`<div class="card-body"><div class="activity"><div class="activity-dot"></div><p>Operator prepares; authorised independent role approves.</p></div><div class="activity"><div class="activity-dot"></div><p>Accounts manager executes. Operator enters bank proof.</p></div><div class="activity"><div class="activity-dot"></div><p>Accounts manager verifies completion. Director and accounts manager are notified.</p></div><div class="info warning">Bank submission and email delivery are simulated. No external connection or money movement.</div></div>`)}</div>`;}
function tracePage(){return heading('DISPATCH & TRACEABILITY','Know where every batch went.','Trace inputs to output, then output to customers.',`<button class="btn" data-action="dispatch">+ Record dispatch</button>`)+card('Batch genealogy',`<div class="card-body"><div class="subtle">Demonstration chain · Source inputs → job card → output → dispatch</div><div class="flow"><div class="flow-node"><b>ZAM-2210-A</b><small>Cocoa input lot</small></div><span class="flow-arrow">→</span><div class="flow-node"><b>JC-G-1022-006</b><small>Historical example production</small></div><span class="flow-arrow">→</span><div class="flow-node"><b>G-DC-2210-A</b><small>Dark Chocolate Slab</small></div><span class="flow-arrow">→</span><div class="flow-node"><b>BakeMasters</b><small>40 kg dispatched · DSP-001</small></div></div><p class="inline-note">Genealogy links are illustrative, not inferred from the historical workbook. Historical JC-006 is not part of the active job-card register.</p></div>`)+card('Customer dispatch register',table(['Dispatch','Customer','Output batch','Quantity','Incident'],state.dispatches.map(d=>`<tr><td>${d.id}<div class="inline-note">${d.date}</div></td><td>${esc(d.customer)}</td><td>${d.batch}</td><td>${n(d.qty)} kg</td><td>${d.incident?pill(d.incident,'red'):pill('No active incident','green')}</td></tr>`)))+card('Recall monitoring',table(['Incident / batch','Affected customer','Dispatched','Returned','Unresolved','Owner'],state.dispatches.filter(d=>d.incident).map(d=>`<tr><td>${d.incident}<div class="code">${d.batch}</div></td><td>${esc(d.customer)}</td><td>${n(d.qty)} kg</td><td>${n(d.returned)} kg</td><td>${n(d.qty-d.returned)} kg</td><td>${d.owner}</td></tr>`)),`<button class="link" data-page="quality">Place a quality hold ↗</button>`)+`<div class="info">Quality may contain immediately. Director authorises customer communication or recall; sales contacts customers. This prototype does not send customer messages.</div>`;}
function approvalsPage(){return heading('CONTROL CENTRE','The right decision, by the right role.','Role switching is a demonstration tool, not secure authentication.')+card('Inventory & production requests',table(['Request','Detail','Prepared by','Approver','Status','Action'],state.requests.map(r=>`<tr><td>${r.id}</td><td>${r.type}<div class="subtle">${esc(r.reason)}</div><div class="code">${r.job||r.item} · ${money(r.amount)}</div></td><td>${r.by}</td><td>${r.approver}</td><td>${pill(r.status)}</td><td>${r.status==='Pending'?btn('Approve','approveRequest',r.id):['Approved','Part issued'].includes(r.status)?btn('Issue approved extra','issueExtra',r.id,true):'—'}</td></tr>`)))+card('Current approval matrix',table(['Domain','Manager authority','Director authority'],[['Inventory adjustments','Store manager ≤ ₹50 lakh','Above ₹50 lakh'],['Supplier payments','Accounts manager ≤ ₹50 lakh','Above ₹50 lakh'],['Customer credits','Accounts manager ≤ ₹50 lakh','Above ₹50 lakh'],['Production JC / recipe','Production manager · operational approval','Exceptions as separately defined'],['Quality hold / release','Quality · no monetary bypass','Cannot substitute for quality release']].map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`)))+`<div class="info">No self-approval or artificial splitting. Requests remain pending if an independent authorised approver is unavailable. Waste routes, non-monetary configuration and some purchasing exceptions still need a validated approval mapping.</div>`;}
function auditPage(){return heading('ACTIVITY','A record of what changed.','Every prototype action retains its role, reference and effect.',`<button class="btn secondary" data-action="export">Export review data</button>`)+`<div class="grid-two"><div>${card('Audit trail',table(['Time / actor','Event','Reference / detail'],state.audit.map(a=>`<tr><td>${esc(a.time)}<div class="inline-note">${esc(a.role)}</div></td><td>${esc(a.action)}</td><td><span class="code">${esc(a.ref)}</span><div class="subtle">${esc(a.detail)}</div></td></tr>`)))}</div><div>${card('Notification centre',`<div class="card-body">${state.notifications.length?state.notifications.map(x=>`<div class="activity notification"><div><p><b>${esc(x.title)}</b></p><small>${esc(x.ref)} · ${esc(x.time)}</small><p class="subtle" style="margin-top:6px">To: ${esc(x.to.join(', '))}</p>${pill(x.channels,'blue')}</div></div>`).join(''):'<div class="empty">Workflow actions will create simulated notifications here.</div>'}</div>`)}</div></div>`;}
function blueprintPage(){return heading('BUILD BLUEPRINT','A real workflow. A clear next build.','The prototype makes the decisions tangible. The blueprint defines the production system.',`<a class="btn secondary" href="#" data-action="downloadBlueprint">Download blueprint ↓</a><button class="btn" data-action="walkthrough">Guided walkthrough</button>`)+`<div class="grid-two"><div>${card('What works in this prototype',`<div class="card-body blueprint"><p>Search the imported material catalogue, follow partial job-card output, request and issue extra material, independently receive waste, inspect and hold batches, approve and complete example payments, dispatch eligible batches and trace affected customers.</p><h3>Source data</h3><p>36 materials, six locations, ten ledger transactions, two transfers and one sales order from your workbook. Source stock is not certified or silently merged into the operating demonstration.</p><h3>Illustrative operating scenario</h3><p>Four job cards, controlled operating lots, two payment requests, example receipts and a waste bank. All names, recipes, test evidence and operating transactions beyond the workbook are hypothetical.</p><h3>Before real production</h3><p>Implement secure sign-in, server-enforced roles and separation, a transactional database, durable audit and evidence storage, notification delivery, concurrent posting controls, financial mappings and tested migration.</p><h3>Not a manufacturing instruction</h3><p>Example recipes and inspection forms illustrate record structure. They must be replaced by validated recipes, test methods, acceptance criteria and appropriate technical review.</p></div>`)}${card('Build stages',table(['Stage','Scope','Completion evidence'],[['01 · Foundation','Identity, entities, material master, units, lots, ledger','Role and balanced posting checks'],['02 · Factory flow','PO/GRN/GIN/MRN, JC, waste, quality, traceability','End-to-end and exception scenarios'],['03 · Finance & control','Matching, advances, credits, bank evidence, recall','Balances, reversals and authority checks'],['04 · Pilot','Verified data, training, reconciliation, backups','Process-owner sign-off and recovery test']].map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`)))}</div><div>${card('Demonstration roles',`<div class="card-body">${ROLES.map(r=>`<div class="stage"><div class="stage-main"><b>${r}</b></div><button class="link" data-role="${r}">Try role →</button></div>`).join('')}</div>`)}${card('Workspace tools',`<div class="card-body"><p class="subtle">Changes remain in this browser. Export review data to retain your walkthrough results.</p><div class="actions"><button class="btn secondary" data-action="export">Export JSON</button><button class="btn secondary" data-action="reset">Reset examples</button></div></div>`)}</div></div>`;}

let issueTab='mrs',mrsLineCount=1,activeGinToken='';
function issuesPage(){
  const mrs=byEntity(state.requisitions),gins=byEntity(state.gins);
  const tabNames=[['mrs','MRS requests'],['gin','GIN register'],['custody','Production custody'],['ledger','GIN stock events']];
  let body='';
  if(issueTab==='mrs')body=card('Material requisition slips',table(['MRS / job card','Purpose / stage','Materials','Status','Action'],mrs.map(r=>`<tr><td><button class="link" data-action="mrsView" data-id="${r.id}">${r.id}</button><div><button class="link code" data-job="${r.job}">${r.job}</button></div><div class="inline-note">${r.entity}</div></td><td>${esc(r.purpose)}<div class="subtle">${esc(r.stage)}</div></td><td>${r.lines.length} line${r.lines.length===1?'':'s'}<div class="inline-note">${n(r.lines.reduce((a,l)=>a+l.issued,0))} kg issued</div></td><td>${pill(r.status)}</td><td><div class="actions">${r.status==='Pending approval'?btn('Review MRS','mrsReview',r.id):['Approved','Part issued'].includes(r.status)?btn('Create GIN','ginCreate',r.id):btn('View','mrsView',r.id,true)}</div></td></tr>`)));
  if(issueTab==='gin')body=card('Goods issue notes to production',table(['GIN / date','Job / MRS','From → to','Issued','Handover','Action'],gins.map(g=>`<tr><td><button class="link" data-action="ginView" data-id="${g.id}">${g.id}</button><div class="inline-note">${g.date}</div></td><td><button class="link code" data-job="${g.job}">${g.job}</button><div class="code">${g.request}</div></td><td>${g.from} → ${g.to}<div class="inline-note">${g.entity}</div></td><td>${n(g.total)} kg<div class="inline-note">${g.lines.length} lot allocation${g.lines.length===1?'':'s'}</div></td><td>${esc(g.handedTo)}<div class="inline-note">Issued by ${esc(g.issuedBy)}</div></td><td>${btn('View / print','ginView',g.id,true)}</td></tr>`)));
  if(issueTab==='custody')body=card('Production custody from new GINs',table(['Job card','Material / lot','Production location','Quantity'],byEntity(state.productionCustody).map(c=>`<tr><td><button class="link code" data-job="${c.job}">${c.job}</button></td><td>${esc(material(c.item)?.Material_Name||c.name)}<div class="code">${c.lot}</div></td><td>${c.location}<div class="inline-note">${c.entity}</div></td><td>${n(c.qty)} ${c.unit}</td></tr>`)))+'<div class="info">This view tracks new GIN handovers in this update, not a reconstruction of earlier example issues. Issuing to production is a custody transfer, not consumption. Later usage and returns require their own records.</div>';
  if(issueTab==='ledger')body=card('Balanced GIN event ledger',table(['Event / GIN','Job / request','Material / lot','Location','Movement'],byEntity(state.issueLedger).map(e=>`<tr><td class="code">${e.id}<div><button class="link" data-action="ginView" data-id="${e.gin}">${e.gin}</button></div></td><td class="code">${e.job}<div>${e.request}</div></td><td>${e.item}<div class="code">${e.lot}</div></td><td>${e.location}<div class="inline-note">${e.kind}</div></td><td>${e.quantity>0?'+':''}${n(e.quantity)} ${e.unit}</td></tr>`)))+'<div class="info">Each GIN allocation has equal stores-out and production-in events. Company physical quantity stays unchanged by the handover.</div>';
  return heading('MATERIAL FLOW / JOB CARD','Request it. Issue it. Trace it.','MRS = production material request. GIN = actual issue to the floor. GRN = supplier receipt.',`<button class="btn secondary" data-action="ginCreate">+ Create GIN</button><button class="btn" data-action="mrsCreate">+ Create MRS</button>`)+`<div class="kpis">${kpi('Pending MRS approval',mrs.filter(r=>r.status==='Pending approval').length,'Production manager review')}${kpi('Approved / part-issued MRS',mrs.filter(r=>['Approved','Part issued'].includes(r.status)).length,'Outstanding approved material')}${kpi('GINs posted',gins.length,'Each physical issue has a numbered document')}${kpi('Issued through new GINs',n(gins.reduce((a,g)=>a+g.total,0))+' kg','Transferred to production, not consumed')}</div><div class="tabs">${tabNames.map(([id,t])=>`<button class="tab ${issueTab===id?'active':''}" data-action="issueTab" data-id="${id}">${t}</button>`).join('')}</div>${body}<div class="info">Use Production operator to create MRS → Production manager to approve → Stores operator to post GIN. Materials, stores and job entity must match. Held or expired lots cannot be issued. <button class="link" data-page="receiving">Supplier GRN creation is in Receipts & transfers →</button></div>`;
}
function jobIssuesSection(j){
  const requests=state.requisitions.filter(r=>r.job===j.id),gins=state.gins.filter(g=>g.job===j.id);
  return card('MRS and GIN documents for this job',table(['Document','Material / quantity','State / reference','Action'],[...requests.map(r=>`<tr><td>${r.id}</td><td>${r.lines.length} materials</td><td>${pill(r.status)}</td><td>${btn('View MRS','mrsView',r.id,true)}</td></tr>`),...gins.map(g=>`<tr><td>${g.id}</td><td>${n(g.total)} kg</td><td>${g.request} · ${g.from} → ${g.to}</td><td>${btn('View GIN','ginView',g.id,true)}</td></tr>`)]),`<div class="actions">${btn('Create MRS','mrsCreate',j.id,true)}<button class="link" data-page="issues">All MRS & GIN →</button></div>`);
}
function mrsLineRow(i){return `<div class="mrs-line" data-line="${i}"><div class="field-row">${select('item'+i,'Material '+(i+1),[['','Choose material'],...source.Material_Master.filter(m=>m.Category==='Raw Material'&&m.Status==='Active').map(m=>[m.Material_ID,m.Material_ID+' · '+m.Material_Name])])}${input('quantity'+i,'Requested quantity · kg','number','','min="0.001" step="0.001"')}</div></div>`;}
function requestLines(r){return table(['Material','Requested','Approved','Already issued','Remaining'],r.lines.map(l=>`<tr><td>${esc(l.name)}<div class="code">${l.item}</div></td><td>${n(l.requested)} kg</td><td>${n(l.approved)} kg</td><td>${n(l.issued)} kg</td><td>${n(Math.max(0,l.approved-l.issued))} kg</td></tr>`));}
function mrsInfo(r){return `<p><b>${r.id}</b> · ${pill(r.status)}</p><p class="code">${r.job} · ${esc(r.entity)} · ${esc(r.stage)}</p><p>${esc(r.reason)}</p>${requestLines(r)}<p class="subtle" style="margin-top:12px">Requested by ${esc(r.requestedBy)}${r.approvedBy?' · Reviewed by '+esc(r.approvedBy):''}. The request and its approval do not move stock.</p>`;}
function ginForm(mrsId='',extraId=''){
  const r=mrsId?state.requisitions.find(r=>r.id===mrsId):state.requests.find(r=>r.id===extraId),j=state.jobs.find(j=>j.id===r?.job);
  if(!r||!j)return infoModal('Select an approved request','<p>An approved MRS or approved extra-material request is required before stores can issue material.</p>');
  const rows=mrsId?r.lines.filter(l=>l.approved>l.issued):[{id:r.id,item:r.item,name:material(r.item)?.Material_Name||r.item,approved:r.qty,issued:r.issued}];
  const stores=source.Location_Master.filter(l=>l.Branch_Entity===j.entity+' Food Products'&&l.Store_Type==='Raw Material');
  activeGinToken=globalThis.crypto?.randomUUID?.()||('gin-'+Date.now()+'-'+Math.random().toString(36).slice(2));
  const date=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'});
  formModal('Create GIN · actual issue to production',`<p><b>${esc(r.id)}</b> · ${esc(j.id)} · ${esc(j.entity)}</p><div class="field-row">${input('date','Actual issue date','date',date,'required')}${select('location','Issuing store',stores.map(l=>[l.Location_ID,l.Location_ID+' · '+l.Store_Name]))}</div>${select('destination','Receiving production floor',[[j.entity==='Goldsmith'?'G-PROD':'C-PROD',j.entity+' production floor · demonstration location']])}${input('handedTo','Handed to · production receiver','text','','required')}<h3>Actual quantities to issue</h3><p class="subtle">Enter a partial quantity or 0 to skip a material. FEFO selects eligible lots within the issuing store.</p>${rows.map((l,i)=>`<div class="field"><label for="f-issue${i}">${esc(l.name)} · ${esc(l.item)} · ${n(l.approved-l.issued)} kg approved and outstanding</label><input id="f-issue${i}" name="issue${i}" type="number" min="0" max="${l.approved-l.issued}" step="0.001" value="${l.approved-l.issued}"></div>`).join('')}${input('remarks','Handover remarks (optional)')}<div class="info">Posting creates one numbered GIN and balanced stores-out / production-in records. Holds, expiry, approval and available quantities are rechecked before posting. No stock moves until you post.</div>`,'Post GIN',p=>{const lines=rows.map((l,i)=>({line:l.id,quantity:p['issue'+i]})).filter(l=>Number(l.quantity)>0);if(run('postGin',{...p,mrs:mrsId,extra:extraId,lines,token:activeGinToken,locations:source.Location_Master})){page='issues';issueTab='gin';render();}});
}
function issueForms(a,id){
  if(!['issueTab','mrsCreate','mrsAddLine','mrsView','mrsReview','ginCreate','ginSelectMrs','ginView','printGin','issueExtra'].includes(a))return false;
  if(a==='issueTab'){issueTab=id;page='issues';render();return true;}
  if(a==='mrsAddLine'){if(mrsLineCount>=20){toast('A maximum of 20 materials per requisition is supported.');return true;}$('#mrs-lines').insertAdjacentHTML('beforeend',mrsLineRow(mrsLineCount++));return true;}
  if(a==='mrsCreate'){
    mrsLineCount=1;
    formModal('Create MRS · material requisition for a job',select('job','Job card',openJobs(),id)+input('stage','Production stage','text','Mixing','required')+select('purpose','Request purpose',['Planned production','Additional material'])+input('needed','Required date','date',new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'}),'required')+reason('Reason / production requirement')+`<h3>Materials required</h3><div id="mrs-lines">${mrsLineRow(0)}</div><button type="button" class="btn secondary small" data-action="mrsAddLine">+ Add material</button><div class="info">Submit as Production operator. Production manager approval comes before stores creates a GIN. MRS submission does not reduce stock.</div>`,'Submit MRS',p=>{const lines=[];for(let i=0;i<mrsLineCount;i++){if(p['item'+i]||p['quantity'+i])lines.push({item:p['item'+i],quantity:p['quantity'+i]});}if(run('createMrs',{...p,lines,materials:source.Material_Master})){page='issues';issueTab='mrs';render();}});return true;
  }
  if(a==='mrsView'){const r=state.requisitions.find(x=>x.id===id);if(r)infoModal('MRS details',mrsInfo(r));return true;}
  if(a==='mrsReview'){const r=state.requisitions.find(x=>x.id===id);if(r)formModal('Production manager review',mrsInfo(r)+select('decision','Decision',['Approve','Reject'])+input('note','Review note','text','','required'),'Save decision',p=>run('reviewMrs',{...p,id}));return true;}
  if(a==='ginCreate'){
    if(id){ginForm(id);return true;}const approved=state.requisitions.filter(r=>['Approved','Part issued'].includes(r.status)&&state.jobs.some(j=>j.id===r.job&&!j.closed));
    if(!approved.length){infoModal('No approved MRS awaiting issue','<p>Create an MRS as Production operator and approve it as Production manager first.</p><button class="btn secondary" type="button" data-action="mrsCreate">Create MRS</button>');return true;}
    formModal('Select MRS for goods issue',select('mrs','Approved MRS',approved.map(r=>[r.id,r.id+' · '+r.job+' · '+r.entity])),'Continue',p=>ginForm(p.mrs));return true;
  }
  if(a==='issueExtra'){ginForm('',id);return true;}
  if(a==='ginView'){
    const g=state.gins.find(x=>x.id===id);if(!g)return true;
    infoModal('Goods issue note · '+g.id,`<div class="gin-document"><h3>${g.id} · Posted</h3><p>${esc(g.entity)} · Issue date ${esc(g.date)}</p><p><b>Job card:</b> ${esc(g.job)}<br><b>Request:</b> ${esc(g.request)}<br><b>Stage:</b> ${esc(g.stage)}<br><b>From:</b> ${esc(g.from)} → <b>To:</b> ${esc(g.to)}</p>${table(['Material','Batch / lot','Expiry','Actual issue'],g.lines.map(l=>`<tr><td>${esc(material(l.item)?.Material_Name||l.name)}<div class="code">${l.item}</div></td><td>${l.lot}</td><td>${l.expiry||'Not applicable'}</td><td>${n(l.quantity)} ${l.unit}</td></tr>`))}<p style="margin-top:15px"><b>Total:</b> ${n(g.total)} kg</p><p><b>Issued by:</b> ${esc(g.issuedBy)}<br><b>Handed to:</b> ${esc(g.handedTo)}<br><b>Request approved by:</b> ${esc(g.approvedBy)}</p><p>${esc(g.reason)}</p><p class="inline-note">${esc(g.created)} · Browser-local demonstration document</p></div><button class="btn secondary no-print" type="button" data-action="printGin">Print GIN</button>`);return true;
  }
  if(a==='printGin'){document.body.classList.add('printing-gin');window.addEventListener('afterprint',()=>document.body.classList.remove('printing-gin'),{once:true});window.print();return true;}
  return true;
}

function render(){const pages={overview,jobs:jobsPage,issues:issuesPage,stock:stockPage,receiving:receivingPage,waste:wastePage,quality:qualityPage,finance:financePage,trace:tracePage,approvals:approvalsPage,audit:auditPage,blueprint:blueprintPage};$('#app').innerHTML=shell((pages[page]||overview)());}
function closeModal(){$('#modal-root').innerHTML='';document.body.style.overflow='';}
const input=(name,label,type='text',value='',extra='')=>`<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`;
const select=(name,label,items,value='')=>`<div class="field"><label for="f-${name}">${label}</label><select name="${name}" id="f-${name}">${items.map(x=>{const [v,t]=Array.isArray(x)?x:[x,x];return `<option value="${esc(v)}" ${v===value?'selected':''}>${esc(t)}</option>`}).join('')}</select></div>`;
const reason=(label='Reason')=>`<div class="field"><label for="f-reason">${label}</label><textarea id="f-reason" name="reason" required></textarea></div>`;
const openJobs=()=>state.jobs.filter(j=>!j.closed).map(j=>[j.id,j.id+' · '+j.product]);
function formModal(title,body,submit,onSubmit){$('#modal-root').innerHTML=`<div class="modal-overlay"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h2>${title}</h2><button data-action="close" aria-label="Close dialog">×</button></header><form id="dialog-form">${body}<div id="form-error" class="error" role="alert"></div><footer><button type="button" class="btn secondary" data-action="close">Cancel</button>${submit?`<button class="btn" type="submit">${submit}</button>`:''}</footer></form></section></div>`;document.body.style.overflow='hidden';$('#dialog-form').onsubmit=e=>{e.preventDefault();onSubmit(Object.fromEntries(new FormData(e.target)));};const el=$('#dialog-form input, #dialog-form select, #dialog-form textarea');if(el)el.focus();}
function infoModal(title,body){formModal(title,body,'',()=>{});}
function action(a,id){if(a==='downloadBlueprint'){const b=new Blob(["# Goldsmith and Chocosmith system build blueprint\n\nVersion 1.0 | 24 October 2026 | Prototype and implementation specification\n\n## Purpose and current delivery\n\nBuild one operations system for Goldsmith and Chocosmith covering inventory, production job cards, waste custody, quality, supplier finance, dispatch and traceability. This release is a working browser-local prototype with realistic hypothetical transactions and a source-derived material catalogue. It is suitable for walkthroughs and workflow review, not live stock control or banking.\n\nThe user-confirmed project design decisions and subsequent revisions govern this blueprint. They are not evidence of formal client policy sign-off. Later revisions supersede historical selections: notably the current manager limit is 50 lakh per transaction, not the earlier 10 lakh or blanket Director-only rule. The complete v0.9 baseline remains unavailable; original decision ID completeness cannot be certified.\n\n## Data provenance and migration readiness\n\nThe supplied Goldsmith & Chocosmith Inventory Master.xlsx has 36 material records, six locations across two entities, ten stock ledger events, two internal transfers, one sales order and five settings. Currency INR is present in the source workbook; adopt INR for this prototype. Do not infer that prices, quantities or customers are validated live operational facts merely because they appear in the workbook.\n\nSource material IDs, names, categories, units, pack sizes, costs and reorder levels are preserved for inspection. Location IDs and names are retained. The workbook settings email is deliberately excluded from the hosted data; it is not authority to send messages. Dates in source transactions are 24 September 2026. Two transfers marked Completed have no transfer events in the supplied ten-event ledger, which contains only opening stock and production issues. Do not infer missing entries or treat source balances as certified opening stock.\n\nThe prototype uses a separate hypothetical operating scenario dated 24 October 2026. All lot expiries, job cards, quality evidence, recipe quantities, suppliers, bank references, payments and users beyond the source catalogue are demonstration data. Source prices are displayed as source values, not approved accounting costs. Before migration, reconcile opening quantities by entity, location, material, lot and status; verify dates, units, ownership and transfer pairs; identify source corrections explicitly; obtain process-owner sign-off.\n\n## Main operating example\n\nJC-G-1024-001 plans 1,100 kg of Winner Milk Chocolate. Its sample input accounting is 1,140 kg issued: 1,100 kg consumed, 20 kg unused returns, 15 kg collected waste and 5 kg unrecoverable loss. The first finished-output entry is 600 kg, with further partial output permitted. Input consumption is not another stock balance to add to the output. This is illustrative mass accounting, not a manufacturing formulation or validated yield model.\n\nA recipe example uses catalogue material names and a 1,100 kg input basis. It must never be used as a food production instruction. Real recipes, process losses, shelf life, sample plans, test methods and acceptance criteria require technical validation. Two more active job cards and a closed historical job card show stage and entity differences. Actual inputs, stock movements and stage transformations must be linked explicitly in the production system rather than inferred from recipe proportions.\n\n## Roles and approval matrix\n\n| Role | Intended responsibilities |\n|---|---|\n| Production operator | Prepare recipes and JCs where authorised; record output, waste and extra-material requests |\n| Production manager | Approve recipes after specialist review where needed; release and revise JCs; verify output; approve substitutions and extra material; investigate excessive waste; close and reopen JCs |\n| Stores operator | Record actual custody, issues, receipts, waste-bank weighing, dispatch and returns |\n| Store manager | Inventory oversight, investigation, count pause, approved operational hold clearance and manager-tier inventory approvals subject to independence |\n| Quality | Output inspection and release, rework suitability, immediate post-release hold, evidence-based quality hold removal and recall assessment |\n| Accounts operator | Invoice and bank-detail entry, payment proof, advance allocation, refunds and reversal requests |\n| Accounts manager | Verification, payment execution, manager-tier financial approvals subject to independence and monthly balance review |\n| Director | Above-limit decisions, limit changes, recall response authorisation and incident closure |\n| Sales or customer service | Credit requests, authorised customer communication and recall follow-up |\n\nInventory: store manager up to and including INR 5,000,000 per transaction; supplier payments and customer credits: accounts manager up to and including INR 5,000,000. Above these amounts requires Director approval. No artificial splitting or manager self-approval. Requests stay pending if the required independent approver is unavailable. Changes to limits require Director approval; preserve the version and effective date. Aggregate the full transaction, not each line. Define gross versus net inventory adjustment values, taxes, charges, related-request scope and foreign currency rules before live routing.\n\nProduction operational and quality decisions are not overridden by monetary limits. Purchasing exceptions, waste-route authorities and non-monetary configuration changes still need an explicit approval mapping; do not give managers assumed rights in unmapped domains. An investigator preparing a request must not self-approve it. Secure named identities and alternate roles are required in production; the prototype role selector is only a simulator.\n\n## Receiving issues and material returns\n\nNormal supplier receipt links an approved PO and records actual quantity. Without a PO, record controlled custody and hold pending the authorised exception decision; original Director selections are subject to the later tiered model and its unresolved domain mapping. Separate over-delivered quantity and hold it. Leave undelivered PO balance outstanding until receipt or authorised short closure; closure does not create stock. Invoice payment eligibility follows accepted receipt, not merely physical custody.\n\nMaterial issue uses eligible lots, FEFO where expiry applies and FIFO otherwise. Hold and expiry checks apply at transaction time, across every channel. An approved extra-material request does not issue stock. Stores posts actual GIN quantity, including partial issues, against the respective JC; preserve original requirement and show extra requests, approvals, issues and variance.\n\nUnused production material uses a separate MRN linked to original GIN line and lot. Store manager checks and approves under the selected return workflow. States distinguish expected return, physical receipt into quarantine, inspection, acceptance pending release, rejection pending disposition and completed action. Split quantities where outcomes differ. Never treat a submitted or missing return as received stock. Partial returns leave balances outstanding; unknown lots and unsupported quantities remain identifiable on hold. Preserve original lot and expiry; no shelf-life reset.\n\n## Ledger invariants and holds\n\nThe production ledger is append-only. Each event records entity, location, material, lot, status, quantity, unit, custody source and destination, source document and line, actor, timestamp, reason and reversal link. Transfers and status changes balance quantities; true losses and gains use separately authorised events. Decide whether issued material remains WIP inventory or is expensed with accounts before financial postings are implemented.\n\nPosting must be atomic and idempotent. Use unique business-event keys, database constraints and locked balance checks. Never allow negative available quantities or double stock creation from retries. Preserve original entered units and conversion versions. Maintain holds as separate records rather than one overwritable status: missing expiry, quality, discrepancy, count pause and incident holds may coexist. Removing one hold cannot remove another. Reserved or picked stock is still checked before issue or dispatch.\n\nMissing required expiry: hold and segregate. Store manager verifies documented supplier or manufacturer evidence and may clear only that hold after valid date and required checks. Expired stock is automatically blocked even after prior release. Store manager receives expiry alerts 30, 15 and 7 days in advance, adjustable by material, through system and email. Exact date boundary, shelf-life criteria and configuration authority need validation.\n\n## Counting and reconciliation\n\nFull monthly count plus weekly counts for high-value or frequently discrepant materials. Store manager proposes list, accounts verifies values and list approval follows the applicable agreed authority. Store manager starts and ends a scoped movement pause. Initial counts are blind; another store team member performs a blind recount. If results differ, a store team member performs a verification count supervised by store manager and both sign. Preserve every result.\n\nStore manager investigates; accounts verifies value and prepares a correction; the independent authorised tier approves; system posts once and notifies Director and store team through system and email. Affected stock stays held while unresolved. Store manager clears the discrepancy hold only after successful posting and resolved investigation. Counter shortages must not be disguised as MRNs, consumption or waste. A corrected source transaction and a separate loss adjustment must not both deduct the same difference.\n\n## Production and job cards\n\nOperator or planner prepares the JC, production manager approves release and all revisions preserve prior versions and actuals. Each JC links an approved recipe version: operator prepares, specialist reviews where required, production manager gives final approval. Substitution requires production manager approval and required specialist review before use. Actual used material and lot remain recorded.\n\nEvery JC supports multiple dated partial finished and semi-finished outputs by stage, unit and batch. Never sum kilograms of semi-finished material with finished boxes or double-count a stage transfer. Production manager verifies output, stores records physical receipt and quality controls inspection release. In-process transfer without stores custody requires its own explicit design rather than fictitious receipt. Batch boundaries, consumption allocation and variable conversions require real process data.\n\nOverproduction preserves original plan and actual quantities and requires manager review. Underproduction may close with manager approval, documented shortfall and reconciled materials, returns and waste. Output completion alone does not close a JC. Production manager closes after reconciliation and appropriately authorised exceptions, or reopens with approval, reason and history. Closure is separate from quality release and financial correction.\n\n## Waste bank\n\nProduction declares collected waste; stores independently weighs and receives. Store manager monitors and investigates dispatch-versus-receipt differences. Production manager investigates excessive process waste. Product or process-specific limits derive from actual data; while undefined show quantities and trends. Threshold breaches notify production manager through system and email. Routine receipts do not require manager approval every time.\n\nWaste bank opening plus actual receipts minus executed authorised outflows equals closing stock. Declared but unreceived waste is not bank stock. Unrecoverable loss creates no fictitious stock. Preserve waste class, original JC, source traceability, actual weight, location, reason and hold status. Financial value requires an accounting decision rather than an assumed zero.\n\nProvide all four routes: rework or reuse, recycler sale, supplier return and disposal. Initially keep them unavailable by waste type until eligibility, technical checks, approvers and evidence requirements are configured. Route capability is not permission. Rework uses quality suitability and a linked manager-approved JC, followed by fresh quality release. Disposal approval alone does not reduce stock: stores executes under manager supervision with dual signatures, accounts verifies completion evidence and actual disposed quantity posts once. Partial completion leaves a held remainder. Notify Director and store team after disposal posting through both channels.\n\n## Quality traceability and recalls\n\nSystem-generated finished and semi-finished batches link JC, stage and actual input genealogy. Quality release is required before use or dispatch. Failed output remains physically segregated and digitally held. Post-release quality can immediately hold affected batches, blocking further use and dispatch without waiting for acknowledgement or monetary approval. Alert Director, production manager and store manager immediately through system and email.\n\nDispatch retains actual batch and quantity by customer. Trace remaining stock and affected customer deliveries. Quality assesses and recommends response, Director authorises customer communication or recall, sales contacts customers, quality provides instructions and stores receives returns into quarantine. Dashboard tracks dispatched, returned and unresolved amounts with a customer follow-up owner. Quality reviews outcome and Director approves incident closure. Only quality clears the post-release quality hold after checks; incident closure does not release stock. Product-specific urgent response and external requirements need validation before live use.\n\n## Supplier and customer finance\n\nOperator enters supplier invoices and documents; accounts manager verifies. Accounts matches approved PO and actual accepted receipt, holding mismatch for investigation. Exception approval follows the applicable defined authority; payment approval remains separate. Detect duplicate invoice entry by supplier and entity, while allowing repeated invoice references in reconciliation, advance applications and partial payments. Pending payments alone do not create a hard block: show pending exposure separately and control actual confirmed settlement.\n\nSupplier advance stays unallocated under supplier until linked to an invoice number. Operator allocates; accounts manager verifies. Retain unused balance, prevent double allocation, review monthly, and record refunds with bank proof and manager verification before reducing the balance. Correct wrong allocations through linked verified reversal, not deletion. Supplier credits settle outstanding invoice amounts; excess stays separately available or is refunded where future purchases are unlikely. Preserve invoice histories and confirmed versus pending amounts.\n\nOperator enters supplier bank details, accounts manager independently verifies with trusted contact before use. Director receives system and email information only, not an approval request. Accounts manager executes approved payments. Operator enters bank reference and proof; accounts manager verifies before completion. Notify Director and accounts manager through both channels. Bank submission is not successful payment. Bank mandates and evidence validation need confirmation.\n\nOrdinary customer returns link original invoice or dispatch, batch, quantity and reason and remain quarantined for quality assessment. Sales requests customer credit, accounts verifies, accounts manager approves up to 50 lakh and Director above. Credit stays available against invoices; cash refund is separate. Suggested extension of operator entry and manager verification to customer-credit allocations and refunds is a consulting default, not a separately confirmed monetary authority for cash refunds.\n\n## Production architecture proposal\n\nUse a browser application with a server API and a relational transactional database. Select the actual hosting provider in implementation; none is required to review the current static prototype. Separate identity, permission evaluation, workflow transitions, quantity posting, evidence storage and notification delivery. Server validates every transition and authority; hiding a button is insufficient. Use durable object storage for signed evidence, an outbox for email delivery after commit, and job processing for expiry review and report refresh. No payment API is enabled by default.\n\nCore records: entity, site, location, user, role assignment, approval policy version, material, unit conversion version, recipe version, JC version, stage, issue, return, batch and genealogy edge, stock event, hold, inspection, count session and result, discrepancy, waste receipt and route action, PO and receipt, supplier invoice, advance, credit, allocation, payment, bank evidence, dispatch, customer return, recall incident, audit event and notification outbox. Use stable internal IDs alongside source business numbers and source provenance.\n\nEvents commit stock, workflow and audit together, then delivery workers send notifications. Retry notifications independently from stock or payment posting. Store monetary amounts as exact decimal or minor currency units and quantities as approved precision decimals. Preserve financial and stock status separately. Implement entity-scoped access, secure sessions, evidence access logs, backup recovery and named-user separation before live pilot.\n\n## Implemented prototype boundary\n\nInteractive: source catalogue search; entity views; JC drill-down; partial output; production verification; extra requests, approval and FEFO issue; waste declaration and independent receipt; quality decisions and incident holds; supplier receipts into hold; payment threshold approval, simulated submission, proof and completion; invoice history; dispatch and recall trace; blind initial count; activity and simulated notifications; browser persistence, reset and JSON export.\n\nSpecified but not fully implemented: authenticated multi-user access, durable shared database, full double-entry stock and finance ledger, actual email, attachments, automated reconciliation, complete PO/MRN and transfer workflows, count pause and independent recount sessions, JC preparation/revision/closure execution, technical waste-route activation, customer-credit/refund execution and full recall closure. The prototype is intentionally explicit about these boundaries. Do not use local browser state as the accounting or stock system of record.\n\n## Demonstration acceptance scenarios\n\n1. Production operator records partial output; production manager verifies; Quality releases; Stores dispatches only available eligible quantity.\n2. Try dispatch before release, after expiry or after a quality incident: block without changing quantity.\n3. Place a quality hold after dispatch and show affected customer plus remaining stock and simulated alerts.\n4. Declare 5 kg collected waste and receive 4.8 kg: preserve both numbers, hold actual 4.8 kg and flag investigation.\n5. Approve extra 5 kg, issue 3 kg and show 2 kg remaining; block issue above remaining allowance and held lots.\n6. Accounts manager approves PAY-001 of 80,000; cannot approve PAY-002 of 52 lakh. Director can approve PAY-002.\n7. Payment cannot complete before submission, operator evidence and accounts manager verification; repeated completion cannot post again.\n8. A blind count mismatch must not directly change stock and must block subsequent affected issue or dispatch.\n9. Receipt with missing expiry or excess remains held and cannot use normal release to bypass the exception.\n10. Reload and retain browser walkthrough state; reset restores only examples, leaving source workbook unchanged.\n\n## Remaining validation and next build\n\nReview this prototype with actual users by running the walkthrough, not another long questionnaire. Record differences as one consolidated change list. Recover v0.9 if available; reconcile IDs and source records. Replace examples with actual recipe and quality specifications, named permissions, batch boundaries and approved opening balances. Validate all authority gaps, amount basis, accounting mappings and external requirements. Build server-backed workflows, execute acceptance scenarios with independent users, test concurrent posting and recovery, then pilot in one store and production line before wider rollout.\n\n## Prototype update 1.1 MRS and GIN\n\n26 October 2026. MRS means Material Requisition Slip: the production request for materials against a specific job. It is not a customer return or a supplier receipt. The implemented sequence is job card \u2192 MRS \u2192 production manager approval \u2192 GIN when stores hands material to the production floor. GRN remains the supplier goods receipt in Receipts & transfers.\n\nThe MRS & GIN menu provides multi-material MRS creation, approve or reject review, partial GIN posting, numbered issue-document viewing and printing, production custody, and balanced stock events. Each job card also links its MRS and GIN records. Requisitions do not move stock; approved quantities stay outstanding until actually issued. Every new extra-material issue also creates a GIN rather than silently adjusting quantities.\n\nThe production operator creates an MRS with job, stage, reason, required date, purpose and material quantities. The production manager approves or rejects with a note. The stores operator chooses an approved request, a source store in the job's entity, actual quantities, issue date, production receiver and matching destination floor. G-PROD and C-PROD are explicitly hypothetical production locations, additional to the original six stores.\n\nEligible lots are allocated using FEFO, with FIFO for explicitly expiry-exempt stock. Missing-required-expiry, expired, quality-held, recall-held, count-held and discrepancy-held quantities are excluded. The system rechecks current expiry even when the transaction date is backdated. Multi-line availability is validated before any mutation. Excess issue beyond approval, cross-entity issue, closed jobs and reused posting references are blocked.\n\nA posted GIN retains request, job, stage, entity, source store, receiving floor, production receiver, date, issuer and actual material/lot splits. Each split has an equal stores-out and production-in event. The handover preserves company physical quantity and increases identified production custody; it does not automatically record consumption. Historical example issues are not silently reconstructed as GINs. The new production-custody view is limited to handovers posted through the added GIN workflow.\n\nThe update preserves existing browser-local walkthrough data while adding the new collections. These remain client-side demonstration controls, not secure authenticated or concurrent server-side postings. Technical production deployment still needs the server-backed controls described above. Corrections and returns must use separate authorised records; posted GINs are not editable through the document view.\n"],{type:'text/markdown'});const u=URL.createObjectURL(b);const link=document.createElement('a');link.href=u;link.download='Goldsmith_Chocosmith_Build_Blueprint_v1.1.md';link.click();URL.revokeObjectURL(u);return;}if(issueForms(a,id))return;if(a==='close')return closeModal();if(a==='menu'){menu=!menu;return render();}if(a==='sourceTransfers'){page='receiving';return render();}if(a==='output')return formModal('Record job-card output',`<p class="subtle">Production operator records; production manager verifies; quality releases. Example expiry, not a shelf-life specification.</p>${select('job','Job card',openJobs(),id)}<div class="field-row">${select('stage','Output stage',['Finished','Semi-finished'])}${input('qty','Actual output · kg','number','', 'min="0.001" step="0.001" required')}</div>${input('expiry','Expiry date · example only','date','2027-04-24','required')}<div class="info">A new batch is created and placed on hold. No automatic quality release.</div>`,'Record output',p=>run('output',p));
